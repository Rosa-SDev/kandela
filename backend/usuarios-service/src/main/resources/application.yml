server:
  port: 8081

spring:
  application:
    name: usuarios-service

  datasource:
    url: jdbc:h2:mem:usuariosdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console