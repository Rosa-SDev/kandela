server:
  port: 8081

spring:
  application:
    name: usuarios-service

  # MongoDB corre en Docker (docker-compose.yml en la raiz del repositorio).
  # replicaSet=rs0 hace que el driver hable con el replica set y no con un nodo suelto.
  mongodb:
    uri: mongodb://localhost:27018/usuariosdb?replicaSet=rs0

  data:
    mongodb:
      # Crea al arrancar los indices declarados con @Indexed.
      auto-index-creation: true
      # Los BigDecimal se guardan como NumberDecimal (Decimal128). Usuarios no
      # maneja dinero, pero se deja igual que en los demas servicios.
      representation:
        big-decimal: decimal128

# Swagger UI: http://localhost:8081/swagger-ui.html
springdoc:
  # Sin esto, springdoc pegaria a cada endpoint todas las respuestas del
  # manejador de errores (400, 401, 404 y 409), aunque ese endpoint no pueda
  # devolverlas. Asi cada endpoint muestra solo las que declara su @ApiResponse.
  override-with-generic-response: false
