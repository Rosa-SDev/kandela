server:
  port: 8082

spring:
  application:
    name: carta-service

  # MongoDB corre en Docker (docker-compose.yml en la raiz del repositorio).
  # replicaSet=rs0 hace que el driver hable con el replica set y no con un nodo suelto.
  mongodb:
    uri: mongodb://localhost:27018/cartadb?replicaSet=rs0

  data:
    mongodb:
      # Crea al arrancar los indices declarados con @Indexed (el nombre unico del platillo).
      auto-index-creation: true
      # Los BigDecimal se guardan como NumberDecimal (Decimal128), no como texto:
      # MongoDB los compara y ordena como numeros sin perder decimales.
      representation:
        big-decimal: decimal128

# Swagger UI: http://localhost:8082/swagger-ui.html
springdoc:
  # Sin esto, springdoc pegaria a cada endpoint todas las respuestas del
  # manejador de errores (400, 404 y 409), aunque ese endpoint no pueda
  # devolverlas. Asi cada endpoint muestra solo las que declara su @ApiResponse.
  override-with-generic-response: false
