server:
  port: 8083

spring:
  application:
    name: clientes-service

  # MongoDB corre en Docker (docker-compose.yml en la raiz del repositorio).
  # replicaSet=rs0 hace que el driver hable con el replica set y no con un nodo suelto.
  mongodb:
    uri: mongodb://localhost:27018/clientesdb?replicaSet=rs0

  data:
    mongodb:
      # Crea al arrancar los indices declarados con @Indexed.
      auto-index-creation: true
      # Los BigDecimal se guardan como NumberDecimal (Decimal128). Clientes no
      # maneja dinero, pero se deja igual que en los demas servicios.
      representation:
        big-decimal: decimal128

# Direcciones de los demás servicios que este consulta.
servicios:
  salon:
    url: http://localhost:8084

# Swagger UI: http://localhost:8083/swagger-ui.html
springdoc:
  # Sin esto, springdoc pegaria a cada endpoint todas las respuestas del
  # manejador de errores (400, 404, 409 y 503), aunque ese endpoint no pueda
  # devolverlas. Asi cada endpoint muestra solo las que declara su @ApiResponse.
  override-with-generic-response: false
