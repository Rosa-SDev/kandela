server:
  port: 8083                          # el puerto de TU servicio

spring:
  application:
    name: clientes-service

  datasource:
    url: jdbc:h2:mem:clientesdb;DB_CLOSE_DELAY=-1   # base de datos EN MEMORIA
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update                 # crea las tablas a partir de tus @Entity
    show-sql: true                     # muestra el SQL en la consola
    open-in-view: false                # evita conexiones abiertas durante toda la petición

  h2:
    console:
      enabled: true
      path: /h2-console                # http://localhost:8083/h2-console