server:
  port: 8084

spring:
  application:
    name: salon-service

  # MongoDB corre en Docker (docker-compose.yml en la raiz del repositorio).
  # replicaSet=rs0 hace que el driver hable con el replica set y no con un nodo suelto.
  mongodb:
    uri: mongodb://localhost:27018/salondb?replicaSet=rs0

  data:
    mongodb:
      # Crea al arrancar los indices declarados con @Indexed.
      auto-index-creation: true
      # Los BigDecimal se guardan como NumberDecimal (Decimal128), no como texto:
      # MongoDB los compara y ordena como numeros sin perder decimales.
      representation:
        big-decimal: decimal128

# Direcciones de los demás servicios que este consulta.
servicios:
  carta:
    url: http://localhost:8082
  usuarios:
    url: http://localhost:8081
