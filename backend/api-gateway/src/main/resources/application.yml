server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuarios
              uri: http://localhost:8081
              predicates:
                - Path=/api/usuarios/**,/api/auth/**

            - id: carta
              uri: http://localhost:8082
              predicates:
                - Path=/api/platillos/**

            - id: clientes
              uri: http://localhost:8083
              predicates:
                - Path=/api/clientes/**,/api/reservas/**

            - id: salon
              uri: http://localhost:8084
              predicates:
                - Path=/api/mesas/**,/api/pedidos/**,/api/facturas/**
